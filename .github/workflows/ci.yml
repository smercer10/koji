# The remote gate. Local hooks (.claude/hooks/) only cover edits made through
# Claude Code; this covers everything, including a commit typed by hand.
#
# Zig is installed by hand rather than with a setup action. A third-party action
# is code running inside the workflow, and the project's dependency count is zero
# — CI is exactly where that erodes first. The install below is a download pinned
# by SHA-256: trust in a number instead of in a repository.
name: ci

on:
  push:
    branches: [main]
  # `edited` is here for the Bench trailer gate at the bottom, which reads the PR
  # description: without it, a description edited after the last run keeps the
  # green check the run before it earned, and the gate guards nothing.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Every branch reaches main through a PR, so push+pull_request covers everything
# without running twice. A new push to a PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Duplicated from build.zig, and safe: build.zig pins 0.16.0 at comptime, so a
  # wrong version here is a hard compile error naming both versions, never a
  # silent test run against the wrong compiler.
  ZIG_VERSION: 0.16.0
  # From https://ziglang.org/download/index.json, x86_64-linux.
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth 1, for the Bench trailer gate below:
      # it diffs the PR against its base, and neither endpoint of that diff is
      # present in a shallow checkout. Thirty-odd commits, so the cost is nil.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Into RUNNER_TEMP, never the checkout: the toolchain ships thousands of
      # .zig files under lib/, which would dirty the tree and be picked up by the
      # fmt check below.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zig"
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p "$dir"
          cd "$dir"

          # ziglang.org asks automated downloads to prefer a community mirror and
          # fall back to the canonical host only if they fail. The checksum is
          # what makes an untrusted mirror safe, so it is verified per candidate:
          # a corrupt or hostile mirror falls through to the next one instead of
          # failing the build.
          mirrors="$(curl -fsSL --max-time 30 https://ziglang.org/download/community-mirrors.txt | shuf -n 4)"
          for base in $mirrors "https://ziglang.org/download/${ZIG_VERSION}"; do
            echo "trying ${base}"
            curl -fsSL --connect-timeout 10 --max-time 120 \
              -o "$tarball" "${base}/${tarball}?source=github-ci" || continue
            if echo "${ZIG_SHA256}  ${tarball}" | sha256sum -c -; then
              found=1
              break
            fi
          done
          test -n "${found:-}" || { echo "no source served a Zig ${ZIG_VERSION} tarball matching ${ZIG_SHA256}"; exit 1; }

          tar -xf "$tarball"
          echo "${dir}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Version
        run: zig version

      # Backstop for .claude/hooks/fmt.sh, which only ever sees Claude's edits.
      - name: Format
        run: zig fmt --check build.zig build.zig.zon src

      # The hooks enforce two rules this repo states in public, and their vector
      # suite was previously run only by a human invoking /audit — so a guard.sh
      # edit that opened a hole could reach main unchallenged. It needs no Zig
      # and takes under a second.
      - name: Hook vectors
        run: bash .claude/hooks/guard_test.sh

      - name: Test
        run: zig build test

      # CLAUDE.md: "Every commit touching search or eval carries `Bench: <nodes>`
      # in its message." It was unenforced, and four of Phase 2's seven commits
      # went in without one — including SEE, the largest node movement in the
      # phase (4,737,990 -> 2,188,249). `git bisect` over a strength regression
      # reads these lines to tell a search change from a no-op, so a gap in them
      # lands the bisect on the wrong commit.
      #
      # This reads the PR description, not a commit message, because the repo
      # squashes with squash_merge_commit_message=PR_BODY: the description *is*
      # the message the merge will write, so the artefact is fully knowable
      # before the merge button exists. An earlier version of this gate ran on
      # push-to-main instead, on the belief that CI could only see the result
      # once it landed. The cost of that belief was paid twice in one evening —
      # a failure on `main` is repaired by force-pushing an amended message
      # through the ruleset, where a failure here is repaired by editing a text
      # box. `ci` is a required check on `main`, so this blocks the merge.
      - name: Bench trailer on search and eval PRs
        if: github.event_name == 'pull_request'
        env:
          # Never interpolate these into the script body: `${{ }}` pastes them as
          # shell source, so a description containing $(...) would execute here.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^src/(search|eval)\.zig$'; then
            # A description typed into the browser textarea arrives CRLF-ended,
            # and the trailing \r alone would defeat the anchored match — on the
            # exact path this gate tells people to use to fix it.
            trailer=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -E '^Bench: [0-9]+$' || true)
            if [ -z "$trailer" ]; then
              echo "::error::This PR touches src/search.zig or src/eval.zig but its description carries no 'Bench: <nodes>' line. The squash body is the description — put the trailer on its last line, then push or re-edit to re-run."
              exit 1
            fi
            echo "Bench trailer present: ${trailer}"
          else
            echo "This PR touches neither src/search.zig nor src/eval.zig; no trailer required."
          fi

      - name: Release build
        run: zig build

      # The OpenBench contract: `make EXE=<name>` drops a binary of exactly that
      # name in the repo root, and `<binary> bench` prints a line OpenBench can
      # parse. Verified by hand once at Phase 0 and otherwise unguarded.
      - name: OpenBench build contract
        run: |
          set -euo pipefail
          make EXE=Engine-CI
          test -x ./Engine-CI
          ./Engine-CI bench | tee /dev/stderr | tail -1 | grep -Eq '^[0-9]+ nodes [0-9]+ nps$'
